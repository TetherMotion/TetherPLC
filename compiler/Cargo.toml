[workspace]
resolver = "2"
members = ["tplc-pkg", "tplc-mir", "tplc-st", "tplc-codegen", "tplc-rt", "tplcc", "fbd-model", "plcopen-io", "fbd-lower"]
# LLVM-free default build: tplcc needs the 'rusty' frontend + 'llvm'
# backend; heavy crates are built explicitly (CI light lane skips them).
default-members = ["tplc-pkg", "tplc-mir", "tplc-st", "tplc-codegen", "tplc-rt", "fbd-model", "plcopen-io", "fbd-lower"]
# spikes/ are standalone roots (excluded from the workspace — they pull
# heavy eval-time deps like ruSTy+LLVM-21 that CI must not build).
exclude = ["spikes/rusty-parse", "spikes/rusty-mir"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MPL-2.0"

[profile.release]
debug = true
