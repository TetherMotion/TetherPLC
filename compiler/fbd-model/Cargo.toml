[package]
name = "fbd-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TetherPLC FBD data model: fbd.v1 JSON document types, canonical io, node-id allocation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true }

[features]
schema = ["dep:schemars"]
