[package]
name = "tplc"
description = "tplc — unified TetherPLC user-facing CLI: compiler, runtime, sim, ctl, IDE backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", features = ["oid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Local-repo ops only (status/diff/commit/log) — no fetch/push, so the
# https/ssh transport features (openssl-sys, libssh2-sys) stay off;
# keeps `cargo build --target` cross-builds free of TLS deps.
git2 = { version = "0.20", default-features = false }
fbd-model = { path = "../fbd-model", features = ["schema"] }
tplc-pkg = { path = "../tplc-pkg" }
