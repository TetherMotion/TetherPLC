[package]
name = "tplcc"
description = "tplcc — Tether PLC compiler driver (P1-08)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tplc-mir = { path = "../tplc-mir" }
tplc-pkg = { path = "../tplc-pkg" }
tplc-rt = { path = "../tplc-rt" }
tplc-st = { path = "../tplc-st", features = ["rusty"] }
tplc-codegen = { path = "../tplc-codegen", features = ["llvm"] }
inkwell = { version = "0.9", features = ["llvm21-1"] }
sha2 = { version = "0.10", features = ["oid"] }
serde_json = "1"
fbd-model = { path = "../fbd-model" }
fbd-lower = { path = "../fbd-lower" }
ed25519-dalek = "2.1.1"
rand = "0.8"
